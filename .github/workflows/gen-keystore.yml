name: 生成签名密钥 (只跑一次)

# Actions 页面 → 左边选 "生成签名密钥" → Run workflow。
# 跑完在这次运行的 Summary 里给出 4 个值，复制到
#   仓库 Settings → Secrets and variables → Actions → New repository secret
# 之后 oneray-apk.yml 就用正式签名出包（可覆盖更新、MIUI 少拦）。
# 密钥备份作为 artifact 上传，务必存好。

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Generate keystore
        run: |
          set -e
          KS_PASS=$(openssl rand -hex 20)
          keytool -genkeypair -v -keystore oneray.jks -alias oneray \
            -keyalg RSA -keysize 2048 -validity 12000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=OneRay, OU=OneRay, O=OneRay, L=NA, ST=NA, C=NA"

          {
            echo "## 复制下面 4 个到 Settings → Secrets and variables → Actions"
            echo ""
            echo '| Name | Secret |'
            echo '|---|---|'
            echo "| \`ANDROID_KEYSTORE_BASE64\` | \`$(base64 -w0 oneray.jks)\` |"
            echo "| \`ANDROID_KEYSTORE_PASSWORD\` | \`$KS_PASS\` |"
            echo "| \`ANDROID_KEY_PASSWORD\` | \`$KS_PASS\` |"
            echo "| \`ANDROID_KEY_ALIAS\` | \`oneray\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-KEEP-SAFE
          path: oneray.jks
          retention-days: 90
