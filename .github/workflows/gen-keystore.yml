name: 生成签名密钥 (只跑一次)

# Actions 页面 → 左边选 "生成签名密钥" → Run workflow。
# 跑完在这次运行的 Summary 里给出 4 个值（每个一个代码块，右上角有复制按钮），
# 复制到 仓库 Settings → Secrets and variables → Actions → New repository secret。
# 也会打包成 oneray-signing-secrets.txt 作为 artifact —— 下载存到离线安全的地方（密码管理器）。
# 之后 oneray-apk.yml 就用正式签名出包（可覆盖更新、MIUI 少拦）。

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Generate keystore
        run: |
          set -e
          KS_PASS=$(openssl rand -hex 20)
          keytool -genkeypair -v -keystore oneray.jks -alias oneray \
            -keyalg RSA -keysize 2048 -validity 12000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=OneRay, OU=OneRay, O=OneRay, L=NA, ST=NA, C=NA"

          KS_B64=$(base64 -w0 oneray.jks)

          # 明文文件作为 artifact 备份
          {
            echo "ANDROID_KEYSTORE_BASE64=$KS_B64"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
            echo "ANDROID_KEY_PASSWORD=$KS_PASS"
            echo "ANDROID_KEY_ALIAS=oneray"
          } > oneray-signing-secrets.txt

          # Summary：每个值单独代码块，方便一键复制
          {
            echo "## 把下面 4 个加到 Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo "名字照抄，值点代码块右上角复制按钮。"
            echo ""
            echo "### ANDROID_KEYSTORE_BASE64"
            echo '```'
            echo "$KS_B64"
            echo '```'
            echo "### ANDROID_KEYSTORE_PASSWORD"
            echo '```'
            echo "$KS_PASS"
            echo '```'
            echo "### ANDROID_KEY_PASSWORD"
            echo '```'
            echo "$KS_PASS"
            echo '```'
            echo "### ANDROID_KEY_ALIAS"
            echo '```'
            echo "oneray"
            echo '```'
            echo ""
            echo "> 另外把本次运行的 **oneray-signing-secrets.txt** artifact 下载，存到密码管理器 —— 丢了以后没法给这个 App 出更新。"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: oneray-signing-secrets
          path: |
            oneray.jks
            oneray-signing-secrets.txt
          retention-days: 90
