name: OneRay APK

# 极简安卓打包：push 到 oneray-rel 分支就自动出 APK。也可在 Actions 页手动 Run。
# 基于 hiddify-app 的 v4.1.2 正式发布 tag（不是 main，main 领先发布 3 个月未经测试）。
# 上游那套 ci/release/build.yml 不用（签名/发布/Sentry/TestFlight 太复杂）。

on:
  push:
    branches: [oneray-rel]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.38.5"
  CHANNEL: prod          # 用正式版 hiddify-next-core v4.1.0（不是 draft）

jobs:
  build-apk:
    runs-on: ubuntu-22.04   # ubuntu-latest(24.04) 上 setup-android 会挂
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      # 跑机自带 Android SDK；不用 android-actions/setup-android（近期在新镜像上不稳）。
      # 只把 license 接掉，剩下的 gradle 自己下。
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up release signing (skipped if secrets absent -> debug-signed)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret -> APK will be debug-signed."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/app/oneray.jks
          printf 'storeFile=oneray.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
          echo "Release signing configured."

      - name: Prepare (pub get / codegen / download core .aar)
        run: make android-apk-prepare

      - name: Regenerate brand launcher icons (OneRay / 光速)
        run: node tool/gen_icons.js

      - name: Resolve version from pubspec
        id: ver
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          NAME=${V%%+*}
          CODE=${V##*+}
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "构建版本 $NAME ($CODE)  commit ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      # build.gradle 读的是 local.properties 里的 flutter.versionName，
      # 新版 Flutter 的 --build-name 不一定写进去 -> 强制写一遍。
      - name: Force version into local.properties
        run: |
          LP=android/local.properties
          [ -f "$LP" ] && grep -v '^flutter\.version' "$LP" > "$LP.tmp" || : > "$LP.tmp"
          mv "$LP.tmp" "$LP"
          printf 'flutter.versionName=%s\nflutter.versionCode=%s\n' \
            "${{ steps.ver.outputs.name }}" "${{ steps.ver.outputs.code }}" >> "$LP"
          echo "--- $LP ---"; cat "$LP"

      - name: Build APK (armeabi-v7a / arm64-v8a / x86_64 / universal via gradle splits)
        run: |
          set -o pipefail
          flutter build apk --release -t lib/main_prod.dart \
            --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }} \
            --dart-define sentry_dsn= 2>&1 | tee /tmp/build.log
          echo "--- APK versionName check ---"
          "$ANDROID_SDK_ROOT"/build-tools/*/aapt dump badging build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 2>/dev/null | grep -o "versionName='[^']*'" || true

      - name: Show build errors (on failure)
        if: failure()
        run: |
          {
            echo '## Build failed — error lines'
            echo '```'
            grep -nE "error:|ERROR|FAILURE:|Exception|AAPT|Execution failed|What went wrong|Caused by" /tmp/build.log | tail -50 || true
            echo ''
            echo '--- last 60 lines ---'
            tail -60 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List outputs + rename APKs + generate releases.json
        run: |
          cd build/app/outputs/flutter-apk
          ls -la
          for f in *.apk; do
            abi=$(echo "$f" | sed -E 's/app-(.*)-release\.apk/\1/; s/app-release\.apk/universal/')
            mv "$f" "OneRay-${{ steps.ver.outputs.name }}-${abi}.apk"
          done
          ls -la; du -h *.apk
          SHA=$(sha256sum "OneRay-${{ steps.ver.outputs.name }}-arm64-v8a.apk" | cut -d' ' -f1)
          cp "OneRay-${{ steps.ver.outputs.name }}-arm64-v8a.apk" oneray.apk
          cat > releases.json <<EOF
          [
            {
              "tag_name": "v${{ steps.ver.outputs.name }}",
              "name": "光速安卓 ${{ steps.ver.outputs.name }}",
              "prerelease": false,
              "mandatory": false,
              "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "html_url": "https://www.guangsuleida.com/dengta/android/",
              "body": "见更新说明",
              "assets": [
                {
                  "name": "oneray.apk",
                  "browser_download_url": "https://dl2.meadowfoundry.com/android/oneray.apk",
                  "mirrors": ["https://www.guangsuleida.com/dengta/android/oneray.apk"],
                  "sha256": "$SHA"
                }
              ]
            }
          ]
          EOF
          echo "SHA256(arm64) = $SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact 里有 oneray.apk + releases.json —— 按 docs/客户端-下载源.md 传到搬瓦工中转 + 香港源站的 android/ 目录" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: OneRay-APK-v${{ steps.ver.outputs.name }}-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/releases.json
          retention-days: 14
          if-no-files-found: error
